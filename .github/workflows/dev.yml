name: CI School Management Platform

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest tests -v

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py

      - name: Verify Kubernetes manifest files
        run: |
          test -f kubernetes/dev/deployment.yaml
          test -f kubernetes/dev/service.yaml
          test -f kubernetes/prod/deployment.yaml
          test -f kubernetes/prod/service.yaml

          grep -q "kind: Deployment" kubernetes/dev/deployment.yaml
          grep -q "kind: Service" kubernetes/dev/service.yaml

          echo "Kubernetes manifest files found"

      - name: Build Docker image
        run: |
          docker build \
            --tag school-management-platform:ci-${{ github.run_number }} \
            .

      - name: Show Docker image
        run: |
          docker images school-management-platform

  deploy-test:

    name: CD - Test Self Hosted Runner

    needs: validate

    if: github.event_name == 'push'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - school

    steps:

      - uses: actions/checkout@v4

      - name: Runner Information
        run: |
          echo "RUNNER"
          hostname
          whoami
          pwd

      - name: Verify Docker
        run: |
          docker --version

      - name: Start and verify Minikube
        run: |
          if ! minikube status >/dev/null 2>&1; then
            echo "Minikube is stopped. Starting cluster..."
            minikube start
          fi

          minikube status
          kubectl get nodes

      - name: Verify Kubernetes
        run: |
          kubectl get nodes

      - name: Verify Repository
        run: |
          ls
