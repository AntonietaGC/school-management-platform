---
- name: Prepare school platform development server
  hosts: local
  connection: local
  become: false
  gather_facts: true

  vars:
    project_name: school-management-platform
    project_directory: "/home/{{ ansible_user_id }}/proyectos/{{ project_name }}"
    required_packages:
      - curl
      - git
      - python3
      - python3-pip
      - python3-venv
      - ca-certificates

  tasks:
    - name: Display target server information
      ansible.builtin.debug:
        msg:
          - "Host: {{ ansible_hostname }}"
          - "Operating system: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "CPU count: {{ ansible_processor_vcpus }}"
          - "Memory: {{ ansible_memtotal_mb }} MB"

    - name: Update APT package cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      become: true
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present

    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_directory }}"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: "0755"

    - name: Verify Docker command
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Verify kubectl command
      ansible.builtin.command:
        cmd: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Display kubectl version
      ansible.builtin.debug:
        var: kubectl_version.stdout

    - name: Verify Minikube command
      ansible.builtin.command:
        cmd: minikube version
      register: minikube_version
      changed_when: false

    - name: Display Minikube version
      ansible.builtin.debug:
        var: minikube_version.stdout

    - name: Check Docker service
      become: true
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Check Minikube status
      ansible.builtin.command:
        cmd: minikube status
      become: false
      register: minikube_status
      changed_when: false
      failed_when: false

    - name: Display Minikube status
      ansible.builtin.debug:
        var: minikube_status.stdout_lines

    - name: Check Kubernetes nodes
      ansible.builtin.command:
        cmd: kubectl get nodes
      become: false
      register: kubernetes_nodes
      changed_when: false
      failed_when: false

    - name: Display Kubernetes nodes
      ansible.builtin.debug:
        var: kubernetes_nodes.stdout_lines

    - name: Check DEV resources
      ansible.builtin.command:
        cmd: kubectl get all -n school-dev
      become: false
      register: dev_resources
      changed_when: false
      failed_when: false

    - name: Display DEV resources
      ansible.builtin.debug:
        var: dev_resources.stdout_lines
